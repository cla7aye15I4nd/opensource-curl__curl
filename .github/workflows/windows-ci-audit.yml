permissions: {}
env:
  CURL_CI: github
  CURL_TEST_MIN: 1900
  CURL_TEST_SSH_KEYALGO: ed25519
  DO_NOT_TRACK: '1'
  OPENSSH_WINDOWS_VERSION: 10.0.0.0p2-Preview
  OPENSSH_WINDOWS_SHA256_ARM64: 698c6aec31c1dd0fb996206e8741f4531a97355686b5431ef347d531b07fcd42
  OPENSSH_WINDOWS_SHA256_WIN64: 23f50f3458c4c5d0b12217c6a5ddfde0137210a30fa870e98b29827f7b43aba5
  STUNNEL_VERSION: 5.82
name: Windows CI audit recheck
'on':
  push:
    branches:
    - codex/windows-ci-audit-20261014
concurrency:
  group: windows-ci-audit-${{ github.sha }}
  cancel-in-progress: false
jobs:
  build-cache:
    name: Build caches
    runs-on: ${{ matrix.image }}
    strategy:
      matrix:
        image:
        - windows-11-arm
        - windows-2022
    steps:
    - name: cache test prereqs (stunnel)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: cache-stunnel
      with:
        path: C:\my-stunnel
        key: ${{ runner.os }}-stunnel-${{ env.STUNNEL_VERSION }}-amd64
        lookup-only: true
    - name: install test prereqs (stunnel)
      if: ${{ !steps.cache-stunnel.outputs.cache-hit }}
      timeout-minutes: 2
      shell: bash
      run: "cd /c && mkdir my-stunnel && cd my-stunnel\ncurl --disable --fail --silent --show-error --connect-timeout\
        \ 15 --max-time 240 --retry 3 --retry-connrefused \\\n  \"https://www.stunnel.org/archive/5.x/stunnel-${STUNNEL_VERSION}-win64-installer.exe\"\
        \ --output pkg.bin\nsha256sum pkg.bin && 7z x -y pkg.bin >/dev/null && rm -f pkg.bin && ls -l && bin/tstunnel\
        \ -version\n"
  share-pool:
    name: '23351: dl-mingw, CM ${{ matrix.ver }}-${{ matrix.env }} ${{ matrix.name }}'
    needs: build-cache
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        shell: msys2 {0}
    env:
      CURL_CI: github
      CURL_TEST_MIN: 1780
      CURL_TEST_SSH_KEYALGO: ed25519
      DO_NOT_TRACK: '1'
      OPENSSH_WINDOWS_VERSION: 10.0.0.0p2-Preview
      OPENSSH_WINDOWS_SHA256_ARM64: 698c6aec31c1dd0fb996206e8741f4531a97355686b5431ef347d531b07fcd42
      OPENSSH_WINDOWS_SHA256_WIN64: 23f50f3458c4c5d0b12217c6a5ddfde0137210a30fa870e98b29827f7b43aba5
      STUNNEL_VERSION: 5.82
      LDFLAGS: -s
      MAKEFLAGS: -j 5
      MATRIX_DIR: ${{ matrix.dir }}
    strategy:
      matrix:
        include:
        - name: schannel +analyzer
          sys: mingw64
          dir: w64devkit
          env: x86_64
          ver: 16.2.0
          url: https://github.com/skeeto/w64devkit/releases/download/v2.10.0/w64devkit-x64-2.10.0.7z.exe
          SHA256: 18d0a4c71a166f8401ab6305781bec5882b40b5e06ba9807c61cb5f3b3c6325e
          config: -DENABLE_DEBUG=ON -DBUILD_SHARED_LIBS=OFF -DCURL_USE_SCHANNEL=ON -DCURL_USE_LIBSSH=ON -DENABLE_UNICODE=OFF
            -DENABLE_UNIX_SOCKETS=OFF -DCURL_GCC_ANALYZER=ON -DCMAKE_C_FLAGS=-DCURL_DEBUG_NO_WIN32_WND
          install: perl mingw-w64-x86_64-libssh
          type: Debug
          chkprefill: ''
          tflags: ''
      fail-fast: false
    steps:
    - name: preinstalled tools
      shell: bash
      run: echo '::group::MSYS2 packages'; /c/msys64/usr/bin/pacman.exe -Q || true; echo '::endgroup::'
    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
      with:
        msystem: ${{ matrix.sys }}
        suppress-deprecation-warnings: msystem-mingw64 msystem-mingw32
        release: false
        update: false
        cache: false
        path-type: inherit
        install: mingw-w64-${{ matrix.env }}-libpsl ${{ matrix.install }}
    - name: cache compiler (gcc ${{ matrix.ver }}-${{ matrix.env }})
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: cache-compiler
      with:
        path: D:\my-cache
        key: ${{ runner.os }}-mingw-w64-${{ matrix.ver }}-${{ matrix.env }}
    - name: install compiler (gcc ${{ matrix.ver }}-${{ matrix.env }})
      if: ${{ !steps.cache-compiler.outputs.cache-hit }}
      timeout-minutes: 5
      env:
        MATRIX_URL: ${{ matrix.url }}
        MATRIX_SHA256: ${{ matrix.SHA256 }}
      run: "cd /d\nmkdir my-cache\ncd my-cache\ncurl --disable --fail --silent --show-error --connect-timeout 15\
        \ --max-time 240 --retry 3 --retry-connrefused \\\n  --location --proto-redir =https \"${MATRIX_URL}\" --output\
        \ pkg.bin\npwd\nsha256sum pkg.bin && sha256sum pkg.bin | grep -qwF -- \"${MATRIX_SHA256}\" && 7z x -y pkg.bin\
        \ >/dev/null && rm -f pkg.bin && ls -l\n"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: bc684be760f7269ec5661a622693e7e93e21bb98
    - name: configure
      timeout-minutes: 5
      env:
        MATRIX_CHKPREFILL: ${{ matrix.chkprefill }}
        MATRIX_CONFIG: ${{ matrix.config }}
        MATRIX_TYPE: ${{ matrix.type }}
        TFLAGS: ${{ matrix.tflags }}
      run: "PATH=\"/d/my-cache/${MATRIX_DIR}/bin:$PATH\"\nfor _chkprefill in '' ${MATRIX_CHKPREFILL}; do\n  options=''\n\
        \  [ \"${TFLAGS}\" = 'skiprun' ] && options+=' -D_CURL_SKIP_BUILD_CERTS=ON'\n  [ \"${_chkprefill}\" = '_chkprefill'\
        \ ] && options+=' -D_CURL_PREFILL=OFF'\n  cmake -B \"bld${_chkprefill}\" -G Ninja ${options} \\\n    -DCMAKE_C_COMPILER=gcc\
        \ \\\n    -DCMAKE_BUILD_TYPE=\"${MATRIX_TYPE}\" \\\n    -DCMAKE_UNITY_BUILD=ON -DCMAKE_UNITY_BUILD_BATCH_SIZE=30\
        \ \\\n    -DCURL_DROP_UNUSED=ON \\\n    -DCURL_WERROR=ON \\\n    -DUSE_LIBIDN2=OFF \\\n    -DCURL_DISABLE_HTTPSIG=OFF\
        \ \\\n    ${MATRIX_CONFIG}\ndone\nif [ -d bld_chkprefill ] && ! diff -u bld/lib/curl_config.h bld_chkprefill/lib/curl_config.h;\
        \ then\n  echo '::group::reference configure log'; cat bld_chkprefill/CMakeFiles/CMake*.yaml 2>/dev/null\
        \ || true; echo '::endgroup::'\n  false\nfi\n"
    - name: configure log
      if: ${{ !cancelled() }}
      run: cat bld/CMakeFiles/CMake*.yaml 2>/dev/null || true
    - name: curl_config.h
      run: 'echo ''::group::raw''; cat bld/lib/curl_config.h || true; echo ''::endgroup::''

        grep -F ''#define'' bld/lib/curl_config.h | sort || true

        '
    - name: libcurl.pc, curl-config
      run: "for f in libcurl.pc curl-config; do\n  echo \"::group::${f}\"; grep -v '^#' bld/\"${f}\" || true; echo\
        \ '::endgroup::'\ndone\n"
    - name: build
      timeout-minutes: 5
      run: 'PATH="/d/my-cache/${MATRIX_DIR}/bin:$PATH"

        cmake --build bld

        '
    - name: curl -V
      timeout-minutes: 1
      run: '/usr/bin/find . \( -name ''*.exe'' -o -name ''*.dll'' -o -name ''*.a'' \) -print0 | grep -z curl | sort
        -z | xargs -0 file --

        /usr/bin/find . \( -name ''*.exe'' -o -name ''*.dll'' -o -name ''*.a'' \) -print0 | grep -z curl | sort
        -z | xargs -0 stat -c ''%10s bytes: %n'' --

        PATH="$PWD/bld/lib:$PATH"

        bld/src/curl.exe --disable --version

        '
    - name: build tests
      if: ${{ matrix.tflags != 'skipall' }}
      timeout-minutes: 10
      run: 'PATH="/d/my-cache/${MATRIX_DIR}/bin:$PATH"

        cmake --build bld --target testdeps

        '
    - name: cache test prereqs (stunnel)
      if: ${{ matrix.tflags != 'skipall' && matrix.tflags != 'skiprun' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: cache-stunnel
      with:
        path: C:\my-stunnel
        key: ${{ runner.os }}-stunnel-${{ env.STUNNEL_VERSION }}-amd64
        fail-on-cache-miss: true
    - name: run tests
      if: ${{ matrix.tflags != 'skipall' && matrix.tflags != 'skiprun' }}
      timeout-minutes: 10
      env:
        TFLAGS: ${{ matrix.tflags }}
      run: 'PATH="/d/my-cache/${MATRIX_DIR}/bin:$PATH"

        TFLAGS="-j8 ${TFLAGS}"

        TFLAGS+='' !498''  # ''Reject too large HTTP response headers on endless redirects'' HTTP, HTTP GET (runtests
        detecting result code 2009 instead of 56 returned by curl)

        TFLAGS+='' ~3000 ~3001 ~3023 ~3024''  # ''HTTPS localhost, last subject alt name matches, CN does not match''
        HTTPS, HTTP GET, PEM certificate (returning 56)

        PATH="$PWD/bld/lib:$PATH:/c/my-stunnel/bin"

        cmake --build bld --target test-ci

        '
    - name: build examples
      if: ${{ !contains(matrix.name, '!examples') }}
      timeout-minutes: 5
      run: 'PATH="/d/my-cache/${MATRIX_DIR}/bin:$PATH"

        cmake --build bld --target curl-examples-build

        '
    - name: disk space used
      run: du -sh .; echo; du -sh -t 250KB ./*; echo; du -h -t 250KB bld
  reader-cleanup:
    name: '23390: msvc, CM ${{ matrix.arch }}-${{ matrix.plat }} ${{ matrix.name }}'
    needs: build-cache
    runs-on: ${{ matrix.image || 'windows-2022' }}
    timeout-minutes: ${{ matrix.arch == 'arm64' && 12 || 10 }}
    defaults:
      run:
        shell: msys2 {0}
    env:
      CURL_CI: github
      CURL_TEST_MIN: 1900
      CURL_TEST_SSH_KEYALGO: ed25519
      DO_NOT_TRACK: '1'
      OPENSSH_WINDOWS_VERSION: 10.0.0.0p2-Preview
      OPENSSH_WINDOWS_SHA256_ARM64: 698c6aec31c1dd0fb996206e8741f4531a97355686b5431ef347d531b07fcd42
      OPENSSH_WINDOWS_SHA256_WIN64: 23f50f3458c4c5d0b12217c6a5ddfde0137210a30fa870e98b29827f7b43aba5
      STUNNEL_VERSION: 5.82
      MATRIX_ARCH: ${{ matrix.arch }}
      MATRIX_IMAGE: ${{ matrix.image }}
      MATRIX_INSTALL_MSYS2: ${{ matrix.install-msys2 }}
      MATRIX_INSTALL_VCPKG: ${{ matrix.install-vcpkg }}
      MATRIX_OPENSSH: ${{ matrix.openssh }}
      MATRIX_PLAT: ${{ matrix.plat }}
      MATRIX_TYPE: ${{ matrix.type }}
      VCPKG_DISABLE_METRICS: '1'
    strategy:
      matrix:
        include:
        - name: schannel U
          install-msys2: perl
          install-vcpkg: zlib libssh2[core,zlib]
          arch: arm64
          env: clang-aarch64
          plat: windows
          type: Debug
          image: windows-11-arm
          openssh: OpenSSH-Windows
          tflags: --min=1850
          config: -DENABLE_DEBUG=ON -DCURL_USE_SCHANNEL=ON -DUSE_WIN32_IDN=ON -DENABLE_UNICODE=ON -DUSE_SSLS_EXPORT=ON
          chkprefill: ''
      fail-fast: false
    steps:
    - name: preinstalled tools
      shell: bash
      run: echo '::group::MSYS2 packages'; /c/msys64/usr/bin/pacman.exe -Q || true; echo '::endgroup::'
    - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
      with:
        msystem: ${{ matrix.arch == 'arm64' && 'clangarm64' || 'ucrt64' }}
        release: false
        cache: ${{ matrix.tflags != 'skiprun' }}
        path-type: inherit
        install: mingw-w64-${{ matrix.env }}-libpsl ${{ matrix.install-msys2 }}
    - name: vcpkg versions
      if: ${{ matrix.install-vcpkg  }}
      timeout-minutes: 1
      run: 'git -C "$VCPKG_INSTALLATION_ROOT" show --no-patch --format=''%H %ai''

        vcpkg version

        '
    - name: vcpkg build
      if: ${{ matrix.install-vcpkg  }}
      timeout-minutes: 45
      run: vcpkg x-set-installed ${MATRIX_INSTALL_VCPKG} --triplet="${MATRIX_ARCH}-${MATRIX_PLAT}"
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        ref: 9c79b72d10aea1d1af59e18312f933fdf0c78934
    - name: configure
      timeout-minutes: 5
      env:
        MATRIX_CHKPREFILL: ${{ matrix.chkprefill }}
        MATRIX_CONFIG: ${{ matrix.config }}
        TFLAGS: ${{ matrix.tflags }}
      run: "[ -f \"${MINGW_PREFIX}/include/zconf.h\" ] && sed -i -E 's|(# +define +Z_HAVE_UNISTD_H)|/*\\1*/|g' \"\
        ${MINGW_PREFIX}/include/zconf.h\"  # Patch MSYS2 zconf.h for MSVC\nfor _chkprefill in '' ${MATRIX_CHKPREFILL};\
        \ do\n  options=''\n  cflags=''\n  rcflags=''\n  ldflags=''\n  cflags+=' -DCURL_DEBUG_NO_WIN32_WND'\n  if\
        \ [ \"${MATRIX_PLAT}\" = 'uwp' ]; then\n    options+=' -DCMAKE_SYSTEM_NAME=WindowsStore -DCMAKE_SYSTEM_VERSION=10.0'\n\
        \    cflags+=' -DWINAPI_FAMILY=WINAPI_FAMILY_PC_APP'\n    ldflags+=' -OPT:NOREF -OPT:NOICF -APPCONTAINER:NO'\n\
        \    vsglobals=';AppxPackage=false;WindowsAppContainer=false'\n  fi\n  if [ \"${TFLAGS}\" = 'skiprun' ];\
        \ then\n    [ \"${MATRIX_ARCH}\" = 'arm64' ] && options+=' -A ARM64'\n    [ \"${MATRIX_ARCH}\" = 'x64' ]\
        \ && options+=' -A x64'\n    [ \"${MATRIX_ARCH}\" = 'x86' ] && options+=' -A Win32'\n    options+=\" -DCMAKE_VS_GLOBALS=TrackFileAccess=false${vsglobals}\"\
        \n    options+=' -D_CURL_SKIP_BUILD_CERTS=ON'\n    unset CMAKE_GENERATOR\n  else\n    # Use Ninja when running\
        \ tests to avoid MSBuild heuristics picking\n    # up \"error messages\" in the test log output and making\
        \ the job fail.\n    # Officially this requires the vcvarsall.bat MS-DOS batch file (as of\n    # VS2022).\
        \ Since it integrates badly with CI steps and shell scripts,\n    # reproduce the necessary build configuration\
        \ manually, without envs.\n    # The option to disable the MSBuild heuristics is likely called:\n    # IgnoreStandardErrorWarningFormat=true,\
        \ but there seems to be no\n    # facility to pass it via CMake or CLI.\n    [[ \"$(uname -s)\" = *'ARM64'*\
        \ ]] && MSVC_HOST='arm64' || MSVC_HOST='x64'  # x86\n    MSVC_ROOTD=\"$(cygpath --mixed --short-name \"\
        $PROGRAMFILES/Microsoft Visual Studio\")\"  # to avoid spaces in directory names\n    echo 'Installed MSVC\
        \ versions:'\n    /usr/bin/find \"$(cygpath --unix \"$MSVC_ROOTD\")\" -mindepth 2 -maxdepth 2 -type d -name\
        \ '*' || true\n    MSVC_EDITION='18/Enterprise/vc/tools/msvc'\n    echo 'Installed MSVC roots:'\n    /usr/bin/find\
        \ \"$(cygpath --unix \"$MSVC_ROOTD/$MSVC_EDITION\")\" -mindepth 1 -maxdepth 1 -type d -name '*.*'\n    MSVC_ROOTU=\"\
        $(/usr/bin/find \"$(cygpath --unix \"$MSVC_ROOTD/$MSVC_EDITION\")\" -mindepth 1 -maxdepth 1 -type d -name\
        \ '*.*' | sort | tail -n 1)\"\n    MSVC_ROOTW=\"$(cygpath --mixed \"$MSVC_ROOTU\")\"\n    MSVC_ROOTU=\"\
        $(cygpath --unix \"$MSVC_ROOTW\")\"\n    MSVC_BINU=\"$MSVC_ROOTU/bin/Host$MSVC_HOST/$MATRIX_ARCH\"\n   \
        \ MSDK_ROOTW=\"$(cygpath --mixed --short-name \"$(printenv 'ProgramFiles(x86)')/Windows Kits\")/10\"\n \
        \   MSDK_ROOTU=\"$(cygpath --unix \"$MSDK_ROOTW\")\"\n    echo 'Installed Windows Kits:'\n    /usr/bin/find\
        \ \"$MSDK_ROOTU/lib\" -mindepth 1 -maxdepth 1 -type d -name '*.*'\n    MSDK_VER=\"$(basename \"$(/usr/bin/find\
        \ \"$MSDK_ROOTU/lib\" -mindepth 1 -maxdepth 1 -type d -name '*.*' | sort | tail -n 1)\")\"\n    MSDK_LIBW=\"\
        $MSDK_ROOTW/lib/$MSDK_VER\"\n    MSDK_INCW=\"$MSDK_ROOTW/include/$MSDK_VER\"\n    MSDK_BINU=\"$MSDK_ROOTU/bin/$MSDK_VER/$MSVC_HOST\"\
        \n    cflags+=\" -external:W0\"\n    cflags+=\" -external:I$MSVC_ROOTW/include\"\n    cflags+=\" -external:I$MSDK_INCW/shared\"\
        \n    cflags+=\" -external:I$MSDK_INCW/ucrt\"\n    cflags+=\" -external:I$MSDK_INCW/um\"\n    cflags+=\"\
        \ -external:I$MSDK_INCW/km\"\n    rcflags+=\" -I$MSDK_INCW/shared\"\n    rcflags+=\" -I$MSDK_INCW/um\"\n\
        \    ldflags+=\" -libpath:$MSVC_ROOTW/lib/$MATRIX_ARCH\"\n    ldflags+=\" -libpath:$MSDK_LIBW/ucrt/$MATRIX_ARCH\"\
        \n    ldflags+=\" -libpath:$MSDK_LIBW/um/$MATRIX_ARCH\"\n    ldflags+=\" -libpath:$MSDK_LIBW/km/$MATRIX_ARCH\"\
        \n    options+=\" -DCMAKE_RC_COMPILER=$MSDK_BINU/rc.exe\"\n    options+=\" -DCMAKE_MT=$MSDK_BINU/mt.exe\"\
        \n    options+=\" -DCMAKE_C_COMPILER=$MSVC_BINU/cl.exe\"\n    export CMAKE_GENERATOR='Ninja Multi-Config'\
        \  # pass it via env to avoid space issues\n    echo \"Using MSVC: ${MSVC_ROOTW}\"\n    echo \"Using Windows\
        \ SDK: ${MSDK_VER}\"\n  fi\n  [ \"${_chkprefill}\" = '_chkprefill' ] && options+=' -D_CURL_PREFILL=OFF'\n\
        \  if [ -n \"${MATRIX_INSTALL_VCPKG}\" ]; then\n    options+=\" -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake\"\
        \n    options+=\" -DVCPKG_INSTALLED_DIR=$VCPKG_INSTALLATION_ROOT/installed\"\n    options+=\" -DVCPKG_TARGET_TRIPLET=${MATRIX_ARCH}-${MATRIX_PLAT}\"\
        \n    options+=\" -DCMAKE_C_COMPILER_TARGET=${MATRIX_ARCH}-${MATRIX_PLAT}\"\n    options+=' -DVCPKG_APPLOCAL_DEPS=OFF'\n\
        \  fi\n  cmake -B \"bld${_chkprefill}\" ${options} \\\n    -DCMAKE_C_FLAGS=\"${cflags}\" \\\n    -DCMAKE_RC_FLAGS=\"\
        ${rcflags}\" \\\n    -DCMAKE_EXE_LINKER_FLAGS=\"-INCREMENTAL:NO ${ldflags}\" \\\n    -DCMAKE_SHARED_LINKER_FLAGS=\"\
        -INCREMENTAL:NO ${ldflags}\" \\\n    -DCMAKE_UNITY_BUILD=ON \\\n    -DCURL_DROP_UNUSED=ON \\\n    -DCURL_WERROR=ON\
        \ \\\n    -DLIBPSL_INCLUDE_DIR=\"${MINGW_PREFIX}/include\" \\\n    -DLIBPSL_LIBRARY=\"${MINGW_PREFIX}/lib/libpsl.dll.a\"\
        \ \\\n    -DBUILD_SHARED_LIBS=OFF \\\n    ${MATRIX_CONFIG}\ndone\nif [ -d bld_chkprefill ] && ! diff -u\
        \ bld/lib/curl_config.h bld_chkprefill/lib/curl_config.h; then\n  echo '::group::reference configure log';\
        \ cat bld_chkprefill/CMakeFiles/CMake*.yaml 2>/dev/null || true; echo '::endgroup::'\n  false\nfi\n"
    - name: configure log
      if: ${{ !cancelled() }}
      run: cat bld/CMakeFiles/CMake*.yaml 2>/dev/null || true
    - name: curl_config.h
      run: 'echo ''::group::raw''; cat bld/lib/curl_config.h || true; echo ''::endgroup::''

        grep -F ''#define'' bld/lib/curl_config.h | sort || true

        '
    - name: libcurl.pc, curl-config
      run: "for f in libcurl.pc curl-config; do\n  echo \"::group::${f}\"; grep -v '^#' bld/\"${f}\" || true; echo\
        \ '::endgroup::'\ndone\n"
    - name: build
      timeout-minutes: 5
      run: cmake --build bld --config "${MATRIX_TYPE}" --parallel 5
    - name: curl -V
      timeout-minutes: 1
      run: "/usr/bin/find . \\( -name '*.exe' -o -name '*.dll' -o -name '*.lib' -o -name '*.pdb' \\) -print0 | grep\
        \ -z curl | sort -z | xargs -0 file --\n/usr/bin/find . \\( -name '*.exe' -o -name '*.dll' -o -name '*.lib'\
        \ -o -name '*.pdb' \\) -print0 | grep -z curl | sort -z | xargs -0 stat -c '%10s bytes: %n' --\nif [ \"\
        ${MATRIX_PLAT}\" != 'uwp' ]; then  # Missing: ucrtbased.dll, VCRUNTIME140D.dll, VCRUNTIME140D_APP.dll\n\
        \  PATH=\"$PWD/bld/lib/${MATRIX_TYPE}:$(cygpath --unix \"${VCPKG_INSTALLATION_ROOT}\")/installed/${MATRIX_ARCH}-${MATRIX_PLAT}/${MATRIX_TYPE}/bin:$PATH\"\
        \n  \"bld/src/${MATRIX_TYPE}/curl.exe\" --disable --version\nfi\n"
    - name: build tests
      if: ${{ matrix.tflags != 'skipall' }}
      timeout-minutes: 10
      run: cmake --build bld --config "${MATRIX_TYPE}" --parallel 5 --target testdeps
    - name: cache test prereqs (stunnel)
      if: ${{ matrix.tflags != 'skipall' && matrix.tflags != 'skiprun' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: cache-stunnel
      with:
        path: C:\my-stunnel
        key: ${{ runner.os }}-stunnel-${{ env.STUNNEL_VERSION }}-amd64
        fail-on-cache-miss: true
    - name: install test prereqs
      if: ${{ matrix.tflags != 'skipall' && matrix.tflags != 'skiprun' }}
      timeout-minutes: 2
      run: "if [ -z \"${MATRIX_OPENSSH}\" ]; then  # MSYS2 openssh\n  /usr/bin/pacman --noconfirm --noprogressbar\
        \ --sync --needed openssh\nelif [ \"${MATRIX_OPENSSH}\" = 'OpenSSH-Windows-builtin' ]; then\n  # https://learn.microsoft.com/windows-server/administration/openssh/openssh_install_firstuse\n\
        \  if [[ \"${MATRIX_IMAGE}\" = *'windows-2025'* ]]; then\n    pwsh -Command 'Add-WindowsCapability -Online\
        \ -Name OpenSSH.Client~~~~0.0.1.0'\n    pwsh -Command 'Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0'\n\
        \  fi\nelse  # OpenSSH-Windows\n  cd /c  # no D: drive on windows-11-arm runners\n  if [[ \"${MATRIX_IMAGE}\"\
        \ = *'-arm'* ]]; then\n    curl --disable --fail --silent --show-error --connect-timeout 15 --max-time 60\
        \ --retry 3 --retry-connrefused \\\n      --location --proto-redir =https \"https://github.com/PowerShell/Win32-OpenSSH/releases/download/${OPENSSH_WINDOWS_VERSION}/OpenSSH-ARM64.zip\"\
