        \ -D_CURL_PREFILL=ON'\n    [ \"${MATRIX_TEST}\" = 'uwp' ] && options+=' -DCMAKE_SYSTEM_NAME=WindowsStore'\n\
        \    [ \"${TFLAGS}\" = 'skiprun' ] && options+=' -D_CURL_SKIP_BUILD_CERTS=ON'\n    [ \"${_chkprefill}\"\
        \ = '_chkprefill' ] && options+=' -D_CURL_PREFILL=OFF'\n    cmake -B \"bld${_chkprefill}\" -G Ninja ${options}\
        \ \\\n      -DCMAKE_INSTALL_PREFIX=\"$HOME\"/curl-install \\\n      -DCMAKE_C_FLAGS=\"${CFLAGS_CMAKE} ${CPPFLAGS}\"\
        \ \\\n      -DCMAKE_BUILD_TYPE=\"${MATRIX_TYPE}\" \\\n      -DCMAKE_UNITY_BUILD=ON -DCMAKE_UNITY_BUILD_BATCH_SIZE=30\
        \ \\\n      -DCURL_WERROR=ON \\\n      ${MATRIX_CONFIG}\n  done\n  if [ -d bld_chkprefill ] && ! diff -u\
        \ bld/lib/curl_config.h bld_chkprefill/lib/curl_config.h; then\n    echo '::group::reference configure log';\
        \ cat bld_chkprefill/CMakeFiles/CMake*.yaml 2>/dev/null || true; echo '::endgroup::'\n    false\n  fi\n\
        else\n  export CFLAGS\n  mkdir bld && cd bld && ../configure --prefix=\"$HOME\"/curl-install --enable-unity\
        \ --enable-warnings --enable-werror --disable-static \\\n    --disable-dependency-tracking --enable-option-checking=fatal\
        \ \\\n    --with-libssh2 \\\n    ${MATRIX_CONFIG}\nfi\n"
    - name: configure log
      if: ${{ !cancelled() }}
      run: cat bld/config.log bld/CMakeFiles/CMake*.yaml 2>/dev/null || true
    - name: curl_config.h
      run: 'echo ''::group::raw''; cat bld/lib/curl_config.h || true; echo ''::endgroup::''

        grep -F ''#define'' bld/lib/curl_config.h | sort || true

        '
    - name: libcurl.pc, curl-config, cmake_install.cmake
      run: "for f in libcurl.pc curl-config cmake_install.cmake; do\n  echo \"::group::${f}\"; grep -v '^#' bld/\"\
        ${f}\" || true; echo '::endgroup::'\ndone\nif command -v pccritic >/dev/null 2>&1; then\n  sed -i.bak 's/\\\
        x0d//g' bld/libcurl.pc  # to suppress pccritic warning: style/PC061\n  pccritic --version\n  pccritic --min-score\
        \ 100 bld/libcurl.pc\nfi\n"
    - name: build
      timeout-minutes: 10
      run: "if [ \"${MATRIX_BUILD}\" = 'cmake' ]; then\n  cmake --build bld --verbose\n  cmake --install bld --verbose\n\
        else\n  make -C bld V=1 install\nfi\n"
    - name: curl -V
      timeout-minutes: 1
      run: "if [ \"${MATRIX_BUILD}\" = 'cmake' ]; then\n  PATH=\"$PWD/bld/lib:$PATH\"\nelse\n  PATH=\"$PWD/bld/lib/.libs:$PATH\"\
        \n  # avoid libtool's curl.exe wrapper for shared builds\n  mv bld/src/.libs/curl.exe bld/src/curl.exe ||\
        \ true\nfi\nfind . \\( -name '*.exe' -o -name '*.dll' -o -name '*.a' \\) -print0 | grep -z curl | sort -z\
        \ | xargs -0 file --\nfind . \\( -name '*.exe' -o -name '*.dll' -o -name '*.a' \\) -print0 | grep -z curl\
        \ | sort -z | xargs -0 stat -c '%10s bytes: %n' --\nif [ \"${MATRIX_TEST}\" != 'uwp' ]; then  # curl: error\
        \ initializing curl library\n  bld/src/curl.exe --disable --version\nfi\n"
    - name: build tests
      if: ${{ matrix.tflags != 'skipall' }}
      timeout-minutes: 10
      run: "if [ \"${MATRIX_BUILD}\" = 'cmake' ]; then\n  cmake --build bld --verbose --target testdeps\nelse\n\
        \  make -C bld V=1 -C tests\nfi\nif [ \"${MATRIX_BUILD}\" != 'cmake' ]; then\n  # avoid libtool's .exe wrappers\
        \ for shared builds\n  mv bld/tests/libtest/.libs/*.exe bld/tests/libtest || true\n  mv bld/tests/server/.libs/*.exe\
        \ bld/tests/server || true\n  mv bld/tests/tunit/.libs/*.exe bld/tests/tunit || true\n  mv bld/tests/unit/.libs/*.exe\
        \ bld/tests/unit || true\nfi\n"
    - name: cache test prereqs (stunnel)
      if: ${{ matrix.tflags != 'skipall' && matrix.tflags != 'skiprun' }}
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
      id: cache-stunnel
      with:
        path: C:\my-stunnel
        key: ${{ runner.os }}-stunnel-${{ env.STUNNEL_VERSION }}-amd64
        fail-on-cache-miss: true
    - name: install test prereqs
      if: ${{ matrix.tflags != 'skipall' && matrix.tflags != 'skiprun' }}
      timeout-minutes: 2
      run: "if [ -z \"${MATRIX_OPENSSH}\" ]; then  # MSYS2 openssh\n  /usr/bin/pacman --noconfirm --noprogressbar\
        \ --sync --needed openssh\nelif [ \"${MATRIX_OPENSSH}\" = 'OpenSSH-Windows-builtin' ]; then\n  # https://learn.microsoft.com/windows-server/administration/openssh/openssh_install_firstuse\n\
        \  if [[ \"${MATRIX_IMAGE}\" = *'windows-2025'* ]]; then\n    pwsh -Command 'Add-WindowsCapability -Online\
        \ -Name OpenSSH.Client~~~~0.0.1.0'\n    pwsh -Command 'Add-WindowsCapability -Online -Name OpenSSH.Server~~~~0.0.1.0'\n\
        \  fi\nelse  # OpenSSH-Windows\n  cd /c  # no D: drive on windows-11-arm runners\n  if [[ \"${MATRIX_IMAGE}\"\
        \ = *'-arm'* ]]; then\n    curl --disable --fail --silent --show-error --connect-timeout 15 --max-time 60\
        \ --retry 3 --retry-connrefused \\\n      --location --proto-redir =https \"https://github.com/PowerShell/Win32-OpenSSH/releases/download/${OPENSSH_WINDOWS_VERSION}/OpenSSH-ARM64.zip\"\
        \ --output pkg.bin\n    sha256sum pkg.bin && sha256sum pkg.bin | grep -qwF -- \"${OPENSSH_WINDOWS_SHA256_ARM64}\"\
        \ && unzip pkg.bin && rm -f pkg.bin\n  else\n    curl --disable --fail --silent --show-error --connect-timeout\
        \ 15 --max-time 60 --retry 3 --retry-connrefused \\\n      --location --proto-redir =https \"https://github.com/PowerShell/Win32-OpenSSH/releases/download/${OPENSSH_WINDOWS_VERSION}/OpenSSH-Win64.zip\"\
        \ --output pkg.bin\n    sha256sum pkg.bin && sha256sum pkg.bin | grep -qwF -- \"${OPENSSH_WINDOWS_SHA256_WIN64}\"\
        \ && unzip pkg.bin && rm -f pkg.bin\n  fi\nfi\n"
    - name: run tests
      if: ${{ matrix.tflags != 'skipall' && matrix.tflags != 'skiprun' }}
      timeout-minutes: ${{ contains(matrix.tflags, '-t') && 15 || 10 }}
      env:
        MATRIX_CONFIG: ${{ matrix.config }}
        MATRIX_INSTALL: ${{ matrix.install }}
        TFLAGS: ${{ matrix.tflags }}
      run: "TFLAGS=\"-j8 ${TFLAGS}\"\nif [ \"${MATRIX_SYS}\" != 'msys' ]; then\n  TFLAGS+=' !498'  # 'Reject too\
        \ large HTTP response headers on endless redirects' HTTP, HTTP GET (runtests detecting result code 2009\
        \ instead of 56 returned by curl)\n  TFLAGS+=' ~3000 ~3001 ~3023 ~3024'  # 'HTTPS localhost, first/last\
        \ subject alt name matches, CN does not match' HTTPS, HTTP GET, PEM certificate (returning 56)\n  if [[\
        \ \"${MATRIX_INSTALL}\" = *'libssh2-wincng'* ]]; then\n    TFLAGS+=' ~SCP ~SFTP'  # Flaky: `-8, Unable to\
        \ exchange encryption keys`. https://github.com/libssh2/libssh2/issues/804\n    unset CURL_TEST_SSH_KEYALGO\
        \  # libssh2 built with WinCNG does not support ssh-ed25519 hostkeys\n    export CURL_TEST_SSH_ENABLE_KEX=diffie-hellman-group16-sha512\n\
        \  fi\n  if [[ \"${MATRIX_CONFIG} \" = *'-DCURL_USE_LIBSSH=ON'* && \\\n        \"${MATRIX_ENV}\" = *'x86_64'*\
        \ ]]; then\n    export CURL_TEST_SSH_DISABLE_KEX=mlkem768x25519-sha256  # broken with libssh 0.12.0 Windows\
        \ x64\n  fi\nfi\nif [ -n \"${MATRIX_OPENSSH}\" ]; then  # OpenSSH-Windows\n  TFLAGS+=' ~601 ~603 ~617 ~619\
        \ ~621 ~641 ~665 ~2004 ~3022'  # SCP\n  if [[ \"${MATRIX_CONFIG} \" = *'-DCURL_USE_LIBSSH=ON'* ]]; then\n\
        \    TFLAGS+=' ~614'  # 'SFTP pre-quote chmod' SFTP, pre-quote, directory\n  fi\nfi\nif [ \"${MATRIX_OPENSSH}\"\
        \ = 'OpenSSH-Windows' ]; then\n  if [[ \"${MATRIX_IMAGE}\" = *'-arm'* ]]; then\n    PATH=\"/c/OpenSSH-ARM64:$PATH\"\
        \n  else\n    PATH=\"/c/OpenSSH-Win64:$PATH\"\n  fi\nfi\nPATH=\"$PATH:/c/my-stunnel/bin\"\nif [ \"${MATRIX_BUILD}\"\
        \ = 'cmake' ]; then\n  PATH=\"$PWD/bld/lib:$PATH\"\n  cmake --build bld --verbose --target test-ci\nelse\n\
        \  PATH=\"$PWD/bld/lib/.libs:$PATH\"\n  make -C bld V=1 test-ci\nfi\n"
    - name: build examples
      if: ${{ matrix.build == 'cmake' || (matrix.tflags == 'skipall' || matrix.tflags == 'skiprun') }}
      timeout-minutes: 5
      run: "if [ \"${MATRIX_BUILD}\" = 'cmake' ]; then\n  cmake --build bld --verbose --target curl-examples-build\n\
        else\n  make -C bld V=1 examples\nfi\n"
    - name: disk space used
      run: du -sh .; echo; du -sh -t 250KB ./*; echo; du -h -t 250KB bld
